# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.21' 
          - 'oldstable'
          - 'stable'
        build-tags:
          - ''
          - 'pgx_collect_safe'
        go-cmd: ['go']
        experimental: [false]
        include:
          - go-version: 'tip'
            build-tags: ''
            go-cmd: 'gotip'
            experimental: true

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go ${{ matrix.go-version }} (or Bootstrap)
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version == 'tip' && '1.26' || matrix.go-version }}
          cache: true

      # Step 2: Manually compile and expose gotip only when the matrix matches 'tip'
      - name: Setup Go Tip
        if: matrix.go-version == 'tip'
        run: |
          go install golang.org/dl/gotip@latest
          gotip download
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "GOROOT=$(gotip env GOROOT)" >> $GITHUB_ENV

      - name: Display Go version
        run: ${{ matrix.go-cmd }} version
      - name: Install dependencies
        run: ${{ matrix.go-cmd }} get .
      - name: Build
        run: ${{ matrix.go-cmd }} build -v -tags="${{ matrix.build-tags }}" ./...
      - name: Test
        run: ${{ matrix.go-cmd }} test -v -tags="${{ matrix.build-tags }}" ./...
